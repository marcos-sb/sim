[project]
name = "sim"
version = "0.1.0"
description = "Agent-based simulation of evolving creature traits on a 2D map"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Marcos Salgueiro Balsa" }]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.4",
  "black>=24",
]

[project.scripts]
sim = "simulate:main"
sim-viz = "visualize:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["simulate", "model", "live_viz", "visualize", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.black]
target-version = ["py311"]
line-length = 100
